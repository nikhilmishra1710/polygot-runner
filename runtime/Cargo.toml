[package]
name = "runtime-worker"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
libc = "0.2.186"
libseccomp = "0.3.0"
rustix = { version = "1.1.4", features = ["pipe", "process", "runtime", "thread"] }
tempfile = "3.27.0"
thiserror = "2.0.18"
uuid = { version = "1.8", features = ["v4", "fast-rng"] }
which = "8.0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
tonic = "0.10"
prost = "0.12"
prost-types = "0.12"
tokio = { version = "1.32", features = ["rt-multi-thread", "macros", "sync", "net"] }
tokio-stream = { version = "0.1", features = ["sync", "net"] }

[build-dependencies]
tonic-build = "0.10"
