name: Rust CI

on:
  push:
  pull_request:

jobs:
  worker:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: runtime

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - run: cargo test
