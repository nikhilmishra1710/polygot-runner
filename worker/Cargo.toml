[package]
name = "runtime-worker"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
libc = "0.2.186"
rustix = { version = "1.1.4", features = ["pipe", "process", "runtime", "thread"] }
tempfile = "3.27.0"
thiserror = "2.0.18"
uuid = { version = "1.8", features = ["v4", "fast-rng"] }
which = "8.0.4"
