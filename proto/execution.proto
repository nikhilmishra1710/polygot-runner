syntax = "proto3";

package execution.v1;

import "google/protobuf/duration.proto";

option go_package = "runtime-platform/api/gen/execution/v1";

service ExecutionService {
  rpc Execute(ExecuteRequest) returns (stream ExecutionEvent);
}

message ExecuteRequest {
  string language = 1;
  repeated SourceFile files = 2;
  bytes stdin = 3;
}

message SourceFile {
  string path = 1;
  bytes contents = 2;
}

message ExecutionEvent {
  enum EventType {
    STARTED = 0;
    STDOUT = 1;
    STDERR = 2;
    FINISHED = 3;
  }
  EventType type = 1;
  bytes data = 2;
  JobResult final_result = 3;
}

message JobResult {
  string id = 1;
  ExecutionReport report = 2;
}

message ExecutionReport {
  Output output = 1;
  TerminationReason termination = 2;
  ExecutionMetrics metrics = 3;
}

message Output {
  bytes stdout = 1;
  bytes stderr = 2;
}

message TerminationReason {
  // Using oneof perfectly mirrors Rust's enum behavior
  oneof reason {
    int32 exit_code = 1;
    int32 signal = 2;
    bool wall_timeout = 3;
    bool cpu_limit = 4;
    bool memory_limit = 5;
    bool oom_killed = 6;
    bool seccomp_violation = 7;
  }
}

message ExecutionMetrics {
  google.protobuf.Duration wall_time = 1;
  google.protobuf.Duration cpu_time = 2;
  uint64 max_rss_bytes = 3;
  uint64 peak_pids = 4;
}